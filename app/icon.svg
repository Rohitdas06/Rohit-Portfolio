<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d" />
      <stop offset="100%" stop-color="#0f1216" />
    </linearGradient>

    <!-- Outer metallic ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563" />
      <stop offset="50%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>

    <!-- Compass needle gradient (Top - Orange accent) -->
    <linearGradient id="orangeNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff782d" />
      <stop offset="100%" stop-color="#d95108" />
    </linearGradient>

    <!-- Compass needle gradient (Bottom - White/Silver) -->
    <linearGradient id="whiteNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#374151" stroke-width="6" />

  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="172" fill="#11151c" stroke="#4b5563" stroke-width="4" />

  <!-- Cardinal Tick Marks -->
  <!-- North -->
  <polygon points="256,92 249,114 263,114" fill="#ff782d" />
  <!-- South -->
  <polygon points="256,420 249,398 263,398" fill="#9ca3af" />
  <!-- East -->
  <polygon points="420,256 398,249 398,263" fill="#9ca3af" />
  <!-- West -->
  <polygon points="92,256 114,249 114,263" fill="#9ca3af" />

  <!-- Crosshair Guides -->
  <line x1="256" y1="122" x2="256" y2="390" stroke="#374151" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="122" y1="256" x2="390" y2="256" stroke="#374151" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Compass Needle (Angled Dynamic Explorer Style) -->
  <g transform="rotate(32 256 256)">
    <!-- Top Half: Orange Pointer -->
    <!-- Left light side -->
    <polygon points="256,120 236,256 256,256" fill="#ff8c42" filter="url(#subtleGlow)" />
    <!-- Right darker shade -->
    <polygon points="256,120 276,256 256,256" fill="url(#orangeNeedle)" />

    <!-- Bottom Half: Silver Pointer -->
    <!-- Left light side -->
    <polygon points="256,392 236,256 256,256" fill="url(#whiteNeedle)" />
    <!-- Right shaded side -->
    <polygon points="256,392 276,256 256,256" fill="#94a3b8" />
  </g>

  <!-- Central Pivot Badge (Circular casing for "R") -->
  <circle cx="256" cy="256" r="48" fill="#181c24" stroke="#4b5563" stroke-width="4" />
  <circle cx="256" cy="256" r="38" fill="#0d1117" />

  <!-- Centered "R" Monogram -->
  <text 
    x="256" 
    y="268" 
    text-anchor="middle" 
    dominant-baseline="central"
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="36" 
    font-weight="900" 
    fill="#ff782d"
    letter-spacing="0"
  >
    R
  </text>
</svg>
